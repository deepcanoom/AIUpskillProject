[pytest]
# Pytest configuration

# Test discovery patterns
# Only tests/ is the automated suite. The root-level test_*.py files are
# manual smoke scripts that call real LLMs / spawn servers (run them with
# `python test_xxx.py`), so a bare `pytest` must not pick them up.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Suppress deprecation warnings from external libraries
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestDeprecationWarning
    # Allow our own code warnings to show through
    default::DeprecationWarning:src.*
    default::UserWarning:src.*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers

# Coverage options (if using pytest-cov)
[coverage:run]
source = src
omit = 
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
